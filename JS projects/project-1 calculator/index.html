<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator">
    
        <div class="screen">
               <span id="display"></span>
               <span id="conclusion"></span>
        </div>
        <div class="buttons">
            <div class="keys" id="AC" >AC</div>
            <div class="keys optr" id="per" >%</div>
            <div class="keys optr" id="DEL" >DEL</div>
            <div class="keys optr" id="DIV" >÷</div>
            
            <div class="keys" id="seven">7</div>
            <div class="keys" id="eight">8</div>
            <div class="keys" id="nine">9</div>
            <div class="keys optr" id="MUL">×</div>

            <div class="keys" id="four">4</div>
            <div class="keys" id="five">5</div>
            <div class="keys" id="six">6</div>
            <div class="keys optr"  id="-">-</div>

            <div class="keys" id="one">1</div>
            <div class="keys" id="two">2</div>
            <div class="keys" id="three">3</div>
            <div class="keys optr" id="+">+</div>

            <div class="keys" id="dzero">00</div>
            <div class="keys" id="zero">0</div>
            <div class="keys" id="dec">.</div>
            <div class="keys" id="equal">=</div>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
