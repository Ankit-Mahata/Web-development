<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="to-do">
        <div id="header">
            <div id="title-box">
                <div id="title">
                    <h1>My To-Do List</h1><span id="icon"><svg xmlns="http://www.w3.org/2000/svg" width="35" height="35"
                            viewBox="0 0 24 24" fill="none" stroke="green" stroke-width="5" stroke-linecap="round"
                            stroke-linejoin="round" class="lucide lucide-check-icon lucide-check">
                            <path d="M20 6 9 17l-5-5" />
                        </svg></span>
                </div>
                <div id="theme"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="lucide lucide-lightbulb-icon lucide-lightbulb">
                        <path
                            d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" />
                        <path d="M9 18h6" />
                        <path d="M10 22h4" />
                    </svg></div>
            </div>
            <div id="moto">Plan your day. Get things done.</div>
        </div>



        <div id="task-manage">
            <input type="text" placeholder="what do you want to do ?">
            <button id="add-btn">+ Add</button>
        </div>


        <div id="nav">

            <div id="filter">

                <div class="space" id="all">
                    All
                </div>
                <div class="space" id="active">
                    Active
                </div>
                <div class="space" id="completed">
                    Completed
                </div>

            </div>

            <div id="clear">
                Clear completed <span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="17" viewBox="0 0 24 24"
                        fill="none" stroke="red" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-trash2-icon lucide-trash-2">
                        <path d="M10 11v6" />
                        <path d="M14 11v6" />
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                        <path d="M3 6h18" />
                        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    </svg></span>
            </div>


        </div>


        <hr>


        <div class="tasks-msg msg-flex" id="tasks">
            <p>No tasks yet. Let's get something done!</p>
        </div>



        <div id="footer">
            <div id="conclusion">
                <div id="result">
                    <span id="remaining">0 </span>out of <span id="total">0</span> completed
                </div>
                <div id="message">
                    Let's get started! 🚀
                </div>
            </div>
            <div id="progress-bar">
                <div id="progress-level"></div>
            </div>
        </div>


    </div>
    <script src="script.js"></script>
</body>

</html>
